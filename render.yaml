services:
  - type: web
    name: pipcat-voice-backend
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: server
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: PIPECAT_ICE_SERVERS
        value: stun:stun.l.google.com:19302

  - type: web
    name: pipcat-voice-client
    runtime: static
    rootDir: client
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        value: https://pipcat-voice-backend.onrender.com

