[project]
name = "pipcat-fish-audio-server"
version = "0.1.0"
description = "Local Pipecat voice agent server with LM Studio and Fish Audio"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai[fish,mlx-whisper,openai,runner,silero,webrtc,whisper]>=0.0.50",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "aiohttp>=3.10.0",
    "python-dotenv>=1.0.1",
    "aiortc>=1.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
